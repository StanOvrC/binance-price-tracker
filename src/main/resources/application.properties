spring.application.name=binance-price-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/pricedb
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate

binance.api.base-url=https://api.binance.com
binance.api.symbol=${BINANCE_SYMBOL:BNBUSDT}
binance.poll.interval=${BINANCE_POLL_INTERVAL:PT30S}